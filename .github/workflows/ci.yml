name : CI
on : push

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: say hello
        run: echo "Hello from GitHub Actions"
      - name: Get the code
        uses: actions/checkout@v7
      - name: List the files
        run: ls

      - name : Godbye 
        run: echo "Goodbye from GitHub Actions"
      - name : Check the home page has <h1> tag
        run: grep "<h1>" index.html